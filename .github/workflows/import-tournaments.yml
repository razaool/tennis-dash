name: Import Tennis Tournaments

on:
  workflow_dispatch:
  schedule:
    # Run daily at 5 AM UTC
    - cron: '0 5 * * *'

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Download TennisMyLife CSV
        run: |
          echo "Downloading ongoing_tourneys.csv from TennisMyLife"
          curl -o matches.csv https://stats.tennismylife.org/data/ongoing_tourneys.csv

      - name: Generate SQL import file
        run: |
          node scripts/import_tennismylife.js matches.csv

      - name: Import to Railway Database
        run: |
          psql "$DATABASE_URL" < matches_import.sql

      - name: Recalculate ELO Ratings
        run: |
          node scripts/calculateELORatings_incremental.js

      - name: Recalculate Glicko2 Ratings
        run: |
          node scripts/calculateGlicko2Ratings_incremental.js

      - name: Recalculate TrueSkill Ratings
        run: |
          node scripts/calculateTrueSkillRatings_incremental.js

      - name: Create Active Player Snapshots
        run: |
          node scripts/create_active_snapshots.js

      - name: Summary
        run: |
          echo "=== Import Complete ==="
          echo "Matches imported from TennisMyLife"
          echo "All ratings recalculated"
          echo "Active player snapshots created"